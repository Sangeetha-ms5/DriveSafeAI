<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Road Safety - Car Sensor</title><style>body{font-family:Arial;text-align:center;background:#111;color:#fff;padding:40px 20px}h1{font-size:28px}#carId{font-size:40px;color:#4CAF50;font-weight:bold;margin:20px 0}#status{font-size:18px;margin-top:20px;color:#ccc}#startBtn{background:#4CAF50;color:#fff;border:0;padding:15px 30px;font-size:18px;border-radius:8px;margin-top:20px}#eventLog{margin-top:30px;text-align:left;background:#222;padding:10px;border-radius:8px;max-height:200px;overflow-y:auto;font-size:13px}.event{color:#ff5252;margin-bottom:6px}</style></head><body><h1>🚗 Road Safety Sensor</h1><div>You are logged in as:</div><div id="carId">Loading...</div><button id="startBtn">Start Driving (Enable Sensors)</button><div id="status">Press the button, then shake / stop the phone suddenly to simulate danger</div><div id="eventLog"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyDb14lZDrU4XASL2IQB3GE4QxIlpobUkYd",authDomain:"road-safety-hackathon-16b7d.firebaseapp.com",projectId:"road-safety-hackathon-16b7d",storageBucket:"road-safety-hackathon-16b7d.firebasestorage.app",messagingSenderId:"697637294869",appId:"1:697637294869:web:ff212611521af2bdcecf1c",measurementId:"G-Y21NXEML0L",databaseURL:"https://road-safety-hackathon-16b7d-default-rtdb.firebaseio.com/"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let carId=localStorage.getItem('car_id');
if(!carId){db.ref('car_counter').transaction(c=>(c||0)+1).then(r=>{carId='Car '+r.snapshot.val();localStorage.setItem('car_id',carId);document.getElementById('carId').innerText=carId}).catch(()=>{carId='Car-'+Math.random().toString(36).slice(2,8);localStorage.setItem('car_id',carId);document.getElementById('carId').innerText=carId})}else document.getElementById('carId').innerText=carId;
let currentLat=12.9716,currentLon=77.5946;if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{currentLat=p.coords.latitude;currentLon=p.coords.longitude},e=>console.warn(e.message),{enableHighAccuracy:true});let lastX=0,lastY=0,lastZ=0,lastEventTime=0;const SHAKE_THRESHOLD=15;
function handleMotion(e){const a=e.accelerationIncludingGravity;if(!a)return;const x=Number(a.x||0),y=Number(a.y||0),z=Number(a.z||0),d=Math.abs(x-lastX)+Math.abs(y-lastY)+Math.abs(z-lastZ);lastX=x;lastY=y;lastZ=z;const now=Date.now();if(d>SHAKE_THRESHOLD&&now-lastEventTime>1500){lastEventTime=now;sendEvent(d,{x,y,z})}}
function sendEvent(m,a){db.ref('events').push({car_id:carId||'UNKNOWN',lat:currentLat,lon:currentLon,accel_x:a.x,accel_y:a.y,accel_z:a.z,magnitude:m,timestamp:new Date().toISOString()});const line=document.createElement('div');line.className='event';line.innerText=`⚠️ Event sent! Magnitude: ${m.toFixed(1)} at ${new Date().toLocaleTimeString()}`;document.getElementById('eventLog').prepend(line);document.getElementById('status').innerText='Event detected and sent to Firebase!'}
document.getElementById('startBtn').addEventListener('click',()=>{if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted'){window.addEventListener('devicemotion',handleMotion);document.getElementById('status').innerText='Sensors active! Shake or stop suddenly.'}else document.getElementById('status').innerText='Permission denied.'}).catch(e=>document.getElementById('status').innerText='Sensor permission error: '+e.message)}else{window.addEventListener('devicemotion',handleMotion);document.getElementById('status').innerText='Sensors active! Shake or stop suddenly.'}});
</script></body></html>
