<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Road Safety - Live Danger Zones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }

    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 9999;
      background: #14161a; color: #f2f2f2; padding: 14px 18px;
      border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      min-width: 230px; font-size: 14px;
    }
    #panel h3 { margin: 0 0 8px 0; font-size: 15px; color: #ff6b6b; }
    #panel .stat { margin: 3px 0; }
    #panel .stat b { color: #8be28b; }

    #resetBtn {
      position: fixed; top: 14px; right: 14px; z-index: 9999;
      padding: 10px 18px; background: #337ab7; color: white;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #resetBtn:hover { background: #286090; }

    #suggestRouteBtn {
      position: fixed; top: 62px; right: 14px; z-index: 9999;
      padding: 10px 18px; background: #5cb85c; color: white;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #suggestRouteBtn:hover { background: #449d44; }
    #suggestRouteBtn:disabled { background: #777; cursor: wait; }

    #logisticsBtn {
      position: fixed; top: 110px; right: 14px; z-index: 9999;
      padding: 10px 18px; background: #6f42c1; color: white;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #logisticsBtn:hover { background: #59339d; }

    #routePanel {
      display: none; position: fixed; top: 110px; right: 14px; z-index: 9999;
      background: white; color: #222; padding: 14px; border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35); width: 340px;
      max-height: 72vh; overflow-y: auto; font-size: 13px;
    }
    #routePanel h3 { margin: 0 0 8px; color: #337ab7; font-size: 16px; }
    .route-card { border-left: 5px solid #5cb85c; background: #f5f5f5; padding: 9px; margin-top: 8px; border-radius: 5px; }
    .route-card.medium { border-left-color: #f0ad4e; }
    .route-card.high { border-left-color: #d9534f; }
    .route-card.selected { outline: 3px solid #337ab7; }
    .route-card button { margin-top: 8px; padding: 7px 10px; border: 0; border-radius: 5px; background: #337ab7; color: white; cursor: pointer; }
    .route-card ol { margin: 7px 0 0 20px; padding: 0; }
    .route-card li { margin: 4px 0; }

    .zone-popup h4 { margin: 0 0 6px 0; }
    .zone-popup .vehicle {
      border-top: 1px solid #ddd; margin-top: 8px; padding-top: 8px;
      font-size: 12px;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      color: white; font-size: 12px; font-weight: bold;
    }
    .popup-section {
      background: #f4f6f8;
      padding: 8px;
      margin-top: 7px;
      border-radius: 6px;
      line-height: 1.55;
    }
    .popup-title {
      font-weight: 700;
      margin-bottom: 3px;
    }
    .risk-box {
      margin-top: 10px;
      padding: 9px;
      border-radius: 7px;
      color: white;
      line-height: 1.45;
    }

    #pipelinePanel {
      position: fixed; bottom: 14px; left: 14px; z-index: 9999;
      background: #14161a; color: #f2f2f2; padding: 14px 18px;
      border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      width: 320px; font-size: 13px; max-height: 260px; overflow-y: auto;
    }
    #pipelinePanel h3 { margin: 0 0 8px 0; font-size: 14px; color: #6bb7ff; }
    #pipelineFeed .idle { color: #888; font-style: italic; }
    .trace {
      border-left: 3px solid #444; padding-left: 8px; margin-bottom: 10px;
      animation: fadeIn 0.3s ease-in;
    }
    .trace .step {
      opacity: 0; transform: translateX(-6px);
      animation: stepIn 0.25s ease-out forwards;
      margin: 2px 0;
    }
    .trace .step.ok { color: #8be28b; }
    .trace .step.warn { color: #ffd479; }
    .trace .step.final { color: #ff8080; font-weight: bold; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes stepIn { to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

  <div id="panel">
    <h3>🚦 Live Danger Zones</h3>
    <div class="stat">Total events: <b id="totalEvents">0</b></div>
    <div class="stat">Danger zones: <b id="totalZones">0</b></div>
    <div class="stat">Status: <b id="status">Waiting for phones...</b></div>
  </div>

  <div id="pipelinePanel">
    <h3>⚙️ India-Smart Filter Pipeline</h3>
    <div id="pipelineFeed"><div class="idle">Waiting for events...</div></div>
  </div>

  <button id="resetBtn" onclick="resetZoneToCurrentLocation()">Reset Zone / Use My Location</button>
  <button id="suggestRouteBtn" onclick="suggestAlternativeRoutes()">Suggest Alternative Route</button>
  <button id="logisticsBtn" onclick="window.location.href='logistics_dashboard.html'">Logistics</button>
  <div id="routePanel"></div>

  <div id="map"></div>

  <script>
    // ---- Firebase config ----
    var firebaseConfig = {
      apiKey: "AIzaSyDb14lZDrU4XASL2IQB3GE4QxIlpobUkdY",
      authDomain: "road-safety-hackathon-16b7d.firebaseapp.com",
      databaseURL: "https://road-safety-hackathon-16b7d-default-rtdb.firebaseio.com/",
      projectId: "road-safety-hackathon-16b7d",
      storageBucket: "road-safety-hackathon-16b7d.firebasestorage.app",
      messagingSenderId: "697637294869",
      appId: "1:697637294869:web:ff212611521af2bdcecf1c"
    };

    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();

    // ---- Tunables ----
    var BASELINE_G = 9.8;
    var BRAKE_FORCE_THRESHOLD = 8.0;
    var CLUSTER_RADIUS_METERS = 500;

    // ---- Map setup ----
    var map = L.map('map').setView([12.9716, 77.5946], 17);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // {lat, lon, events: [...], circle}
    var zones = [];
    var firstEventCentered = false;
    var currentLocationMarker = null;
    var currentLocationAccuracy = null;
    var routeLayers = [];
    var routeOptions = [];
    var navigationWatchId = null;
    var navigationStepIndex = 0;
    var navigationMarker = null;

    // Prevent the same Firebase event from being inserted twice.
    var processedEventIds = new Set();

    function haversineMeters(lat1, lon1, lat2, lon2) {
      var R = 6371000;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;

      var a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);

      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function colorFor(vehicleCount) {
      if (vehicleCount >= 3) return "#d9534f";
      if (vehicleCount === 2) return "#f0ad4e";
      return "#5cb85c";
    }

    function riskText(vehicleCount) {
      if (vehicleCount >= 3) return "RED - HIGH RISK";
      if (vehicleCount === 2) return "ORANGE - RISING RISK";
      return "GREEN - WATCHING";
    }

    function getVehicleIds(zone) {
      var normalized = zone.events
        .map(function(e) {
          return String(
            e.car_id !== undefined && e.car_id !== null
              ? e.car_id
              : "UNKNOWN"
          ).trim().toLowerCase();
        })
        .filter(function(id) {
          return id !== "";
        });

      return Array.from(new Set(normalized));
    }

    function displayVehicleId(e) {
      return String(
        e.car_id !== undefined && e.car_id !== null
          ? e.car_id
          : "UNKNOWN"
      );
    }

    function safeNumber(value, fallback) {
      var n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function buildPopupHtml(zone) {
      var vehicleIds = getVehicleIds(zone);
      var zoneColor = colorFor(vehicleIds.length);

      var html =
        '<div class="zone-popup" style="min-width:340px;max-height:520px;overflow-y:auto;">';

      // ---- Zone summary ----
      html += '<h4>🚨 Danger Zone</h4>';

      html +=
        '<div style="margin-bottom:8px;">' +
        '<span class="badge" style="background:' + zoneColor + '">' +
        vehicleIds.length +
        ' vehicle(s) confirmed</span>' +
        '</div>';

      html += '<div class="popup-section">';
      html += '<div class="popup-title">📍 Zone Summary</div>';
      html +=
        'Latitude: <b>' + safeNumber(zone.lat, 0).toFixed(6) + '</b><br>';
      html +=
        'Longitude: <b>' + safeNumber(zone.lon, 0).toFixed(6) + '</b><br>';
      html += 'Unique vehicles: <b>' + vehicleIds.length + '</b><br>';
      html += 'Total events: <b>' + zone.events.length + '</b><br>';
      html +=
        'Current risk: <b style="color:' +
        zoneColor +
        '">' +
        riskText(vehicleIds.length) +
        '</b>';
      html += '</div>';

      // ---- Processing flow ----
      html += '<div class="popup-section">';
      html += '<div class="popup-title">⚙️ Processing Pipeline</div>';
      html +=
        '📡 Data collection: <b>received</b><br>' +
        '🧹 Data cleaning: <b>completed</b><br>' +
        '✂️ Chunking: <b>event prepared</b><br>' +
        '🔢 Feature extraction: <b>completed</b><br>' +
        '🧠 Detection logic: <b>applied</b><br>' +
        '🇮🇳 India-Smart filtering: <b>applied</b><br>' +
        '📍 Cross-vehicle clustering: <b>completed</b><br>' +
        '🚦 Danger-zone classification: <b>updated</b>';
      html += '</div>';

      // ---- Every event / vehicle ----
      zone.events.forEach(function(e, index) {
        var magnitude = safeNumber(e.magnitude, 0);
        var accelX = safeNumber(e.accel_x, 0);
        var accelY = safeNumber(e.accel_y, 0);
        var accelZ = safeNumber(e.accel_z, 0);

        var brakeForce = safeNumber(
          e.brake_force !== undefined ? e.brake_force : e.magnitude,
          magnitude
        );

        var vectorMagnitude = Math.sqrt(
          accelX * accelX +
          accelY * accelY +
          accelZ * accelZ
        );

        var excessForce = Math.max(0, magnitude - BASELINE_G);

        var isDanger = magnitude >= BRAKE_FORCE_THRESHOLD;

        var detection = isDanger
          ? "HARD BRAKE / SWERVE"
          : "MOTION EVENT";

        var indiaSmart = isDanger
          ? "REAL DANGER"
          : "LOW CONFIDENCE";

        html +=
          '<div class="vehicle">' +
          '<div style="font-size:14px;margin-bottom:6px;">' +
          '<b>📱 Vehicle ' +
          (index + 1) +
          ': ' +
          displayVehicleId(e) +
          '</b>' +
          '</div>';

        // Sensor values
        html += '<div class="popup-section">';
        html += '<div class="popup-title">📊 Sensor / Magnitude Data</div>';
        html += 'Magnitude: <b>' + magnitude.toFixed(2) + '</b><br>';
        html += 'Acceleration X: ' + accelX.toFixed(2) + '<br>';
        html += 'Acceleration Y: ' + accelY.toFixed(2) + '<br>';
        html += 'Acceleration Z: ' + accelZ.toFixed(2) + '<br>';
        html += 'Vector magnitude: ' + vectorMagnitude.toFixed(2);
        html += '</div>';

        // Deceleration
        html += '<div class="popup-section">';
        html += '<div class="popup-title">🛑 Braking / Deceleration</div>';
        html += 'Brake force: <b>' + brakeForce.toFixed(2) + '</b><br>';
        html += 'Baseline: ' + BASELINE_G.toFixed(2) + '<br>';
        html += 'Excess force: ' + excessForce.toFixed(2);
        html += '</div>';

        // Detection
        html += '<div class="popup-section">';
        html += '<div class="popup-title">🧠 Detection Logic</div>';
        html += 'Event type: <b>' + detection + '</b><br>';
        html +=
          'Detection threshold: ' +
          BRAKE_FORCE_THRESHOLD.toFixed(2) +
          '<br>';
        html +=
          'Detection status: <b>' +
          (isDanger ? 'CONFIRMED' : 'MONITORING') +
          '</b>';
        html += '</div>';

        // India Smart
        html += '<div class="popup-section">';
        html += '<div class="popup-title">🇮🇳 India-Smart Filter</div>';
        html += 'Filter: <b>APPLIED</b><br>';
        html +=
          'Force check: <b>' +
          (isDanger ? 'PASSED' : 'LOW') +
          '</b><br>';
        html += 'Classification: <b>' + indiaSmart + '</b>';
        html += '</div>';

        // Location/time
        html += '<div class="popup-section">';
        html += '<div class="popup-title">📍 Location & Time</div>';
        html +=
          'Latitude: ' + safeNumber(e.lat, 0).toFixed(6) + '<br>';
        html +=
          'Longitude: ' + safeNumber(e.lon, 0).toFixed(6) + '<br>';
        html +=
          'Timestamp: ' +
          String(e.timestamp !== undefined ? e.timestamp : 'N/A');
        html += '</div>';

        html += '</div>';
      });

      // ---- Final risk ----
      html +=
        '<div class="risk-box" style="background:' +
        zoneColor +
        ';">';

      if (vehicleIds.length >= 3) {
        html +=
          '<b>🔴 RED — HIGH RISK</b><br>' +
          '3 or more independent vehicles confirmed this location.';
      } else if (vehicleIds.length === 2) {
        html +=
          '<b>🟠 ORANGE — RISING RISK</b><br>' +
          '2 independent vehicles confirmed this location.';
      } else {
        html +=
          '<b>🟢 GREEN — WATCHING</b><br>' +
          '1 vehicle currently confirms this location.';
      }

      html += '</div>';
      html += '</div>';

      return html;
    }

    function renderZone(zone) {
      var vehicleIds = getVehicleIds(zone);
      var color = colorFor(vehicleIds.length);
      var popup = buildPopupHtml(zone);

      if (zone.circle) {
        zone.circle.setLatLng([zone.lat, zone.lon]);
        zone.circle.setStyle({
          color: color,
          fillColor: color
        });
        zone.circle.setPopupContent(popup);
        zone.circle.redraw();
      } else {
        zone.circle = L.circle([zone.lat, zone.lon], {
          radius: 30,
          color: color,
          fillColor: color,
          fillOpacity: 0.55
        })
          .addTo(map)
          .bindPopup(popup, {
            maxWidth: 500,
            maxHeight: 560
          });
      }
    }

    function traceStep(container, text, cls, delay) {
      return new Promise(function(resolve) {
        setTimeout(function() {
          var div = document.createElement('div');
          div.className = 'step ' + cls;
          div.innerText = text;
          container.appendChild(div);
          resolve();
        }, delay);
      });
    }

    async function runPipelineTrace(e) {
      var feed = document.getElementById('pipelineFeed');
      var idle = feed.querySelector('.idle');

      if (idle) idle.remove();

      var trace = document.createElement('div');
      trace.className = 'trace';
      feed.prepend(trace);

      await traceStep(
        trace,
        '📡 Data collection: ' + displayVehicleId(e) + ' sensor payload received',
        'ok',
        0
      );

      await traceStep(
        trace,
        '🧹 Clean & sync data: noise removed, timestamp normalized',
        'ok',
        150
      );

      await traceStep(
        trace,
        '✂️ Chunking: discrete motion event prepared',
        'ok',
        150
      );

      await traceStep(
        trace,
        '🔢 Feature extraction: magnitude + acceleration features calculated',
        'ok',
        150
      );

      await traceStep(
        trace,
        '🧠 Detection logic: magnitude=' +
          safeNumber(e.magnitude, 0).toFixed(1) +
          ' → classified HARD BRAKE/SWERVE',
        'ok',
        150
      );

      await traceStep(
        trace,
        '🇮🇳 India-Smart Filter: contextual danger check applied',
        'warn',
        200
      );

      await traceStep(
        trace,
        '🏷 Tag event: location + time + vehicle attached',
        'ok',
        150
      );

      await traceStep(
        trace,
        '📍 Cross-vehicle location clustering: checking nearby events...',
        'ok',
        200
      );

      var traces = feed.querySelectorAll('.trace');

      if (traces.length > 6) {
        traces[traces.length - 1].remove();
      }
    }

    function addEvent(e, eventId) {
      if (!e) return;

      // Avoid duplicate processing.
      if (eventId && processedEventIds.has(eventId)) {
        return;
      }

      if (eventId) {
        processedEventIds.add(eventId);
      }

      var lat = safeNumber(e.lat, NaN);
      var lon = safeNumber(e.lon, NaN);
      var magnitude = safeNumber(e.magnitude, NaN);

      if (!Number.isFinite(lat) ||
          !Number.isFinite(lon) ||
          !Number.isFinite(magnitude)) {
        return;
      }

      // Center map on the first valid event.
      if (!firstEventCentered) {
        map.setView([lat, lon], 18);
        firstEventCentered = true;
      }

      // Keep compatibility with the existing dashboard behavior.
      e.brake_force =
        e.brake_force !== undefined
          ? e.brake_force
          : magnitude;

      var matched = null;

      for (var i = 0; i < zones.length; i++) {
        var d = haversineMeters(
          zones[i].lat,
          zones[i].lon,
          lat,
          lon
        );

        if (d <= CLUSTER_RADIUS_METERS) {
          matched = zones[i];
          break;
        }
      }

      if (matched) {
        matched.events.push(e);

        var lats = matched.events.map(function(ev) {
          return safeNumber(ev.lat, matched.lat);
        });

        var lons = matched.events.map(function(ev) {
          return safeNumber(ev.lon, matched.lon);
        });

        matched.lat =
          lats.reduce(function(a, b) { return a + b; }, 0) /
          lats.length;

        matched.lon =
          lons.reduce(function(a, b) { return a + b; }, 0) /
          lons.length;
      } else {
        matched = {
          lat: lat,
          lon: lon,
          events: [e]
        };

        zones.push(matched);
      }

      var vehicleIds = getVehicleIds(matched);

      // Update the most recent pipeline trace.
      var feed = document.getElementById('pipelineFeed');
      var latestTrace = feed.querySelector('.trace');

      if (latestTrace) {
        var final = document.createElement('div');
        final.className = 'step final';

        final.innerText =
          '🚩 Danger zone flagged/updated: ' +
          vehicleIds.length +
          ' vehicle(s) → ' +
          riskText(vehicleIds.length);

        setTimeout(function() {
          latestTrace.appendChild(final);
        }, 600);
      }

      // Re-render immediately.
      renderZone(matched);
      updatePanel();

      // If popup is already open, refresh its content immediately.
      if (matched.circle && matched.circle.isPopupOpen()) {
        matched.circle.setPopupContent(buildPopupHtml(matched));
      }
    }

    function updatePanel() {
      var totalEvents = zones.reduce(function(sum, z) {
        return sum + z.events.length;
      }, 0);

      document.getElementById('totalEvents').innerText = totalEvents;
      document.getElementById('totalZones').innerText = zones.length;

      document.getElementById('status').innerText =
        totalEvents > 0 ? 'Live' : 'Waiting for phones...';
    }

    function clearRouteLayers() {
      routeLayers.forEach(function(layer) { map.removeLayer(layer); });
      routeLayers = [];
      routeOptions = [];
    }

    function routeRisk(routeCoordinates) {
      var nearbyEvents = 0;
      var highEvents = 0;
      zones.forEach(function(zone) {
        var nearRoute = routeCoordinates.some(function(point) {
          return haversineMeters(zone.lat, zone.lon, point[0], point[1]) <= 300;
        });
        if (nearRoute) {
          nearbyEvents += zone.events.length;
          zone.events.forEach(function(event) {
            if (safeNumber(event.magnitude, 0) > 20) highEvents += 1;
          });
        }
      });
      if (highEvents > 0 || nearbyEvents >= 3) {
        return { label: 'HIGH', className: 'high', details: nearbyEvents + ' nearby event(s), including ' + highEvents + ' high-severity event(s)' };
      }
      if (nearbyEvents > 0) {
        return { label: 'MEDIUM', className: 'medium', details: nearbyEvents + ' nearby event(s) within 300 m' };
      }
      return { label: 'LOW', className: '', details: 'No live danger zones within 300 m' };
    }

    function formatDuration(seconds) {
      var minutes = Math.round(seconds / 60);
      if (minutes < 60) return minutes + ' min';
      return Math.floor(minutes / 60) + ' hr ' + (minutes % 60) + ' min';
    }

    function describeStep(step) {
      var name = step.name ? ' on ' + step.name : '';
      var distance = step.distance >= 1000
        ? (step.distance / 1000).toFixed(1) + ' km'
        : Math.round(step.distance) + ' m';
      var maneuver = step.maneuver || {};
      var type = maneuver.type || 'Continue';
      var modifier = maneuver.modifier ? ' ' + maneuver.modifier : '';
      var instruction = type === 'depart' ? 'Start' :
        type === 'arrive' ? 'Arrive at destination' :
        type === 'roundabout' ? 'Enter roundabout' :
        type.charAt(0).toUpperCase() + type.slice(1) + modifier;
      return instruction + name + ' (' + distance + ')';
    }

    function selectRoute(index) {
      var selected = routeOptions[index];
      if (!selected) return;
      routeLayers.forEach(function(layer, layerIndex) {
        layer.setStyle({
          weight: layerIndex === index ? 8 : 4,
          opacity: layerIndex === index ? 1 : 0.45
        });
      });
      document.querySelectorAll('.route-card').forEach(function(card, cardIndex) {
        card.classList.toggle('selected', cardIndex === index);
      });
      map.fitBounds(selected.layer.getBounds(), { padding: [40, 40] });
      var message = selected.steps.map(describeStep).join('. ');
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        var speech = new SpeechSynthesisUtterance(
          'Selected route ' + (index + 1) + '. ' +
          selected.risk.label + ' risk. Estimated time ' +
          formatDuration(selected.route.duration) + '. ' + message
        );
        speech.rate = 0.95;
        window.speechSynthesis.speak(speech);
      }
      document.getElementById('status').innerText =
        'Route ' + (index + 1) + ' selected.';
    }

    function startNavigation(index) {
      selectRoute(index);
      if (!navigator.geolocation) {
        alert('Location tracking is not supported by this browser.');
        return;
      }
      var selected = routeOptions[index];
      if (navigationWatchId !== null) navigator.geolocation.clearWatch(navigationWatchId);
      navigationStepIndex = 0;
      var announce = function(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }
      };
      announce('Navigation started. ' + describeStep(selected.steps[0]));
      navigationWatchId = navigator.geolocation.watchPosition(function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        map.setView([lat, lon], 17);
        if (navigationMarker) map.removeLayer(navigationMarker);
        navigationMarker = L.marker([lat, lon]).addTo(map).bindPopup('You are here').openPopup();
        var nextStep = selected.steps[navigationStepIndex];
        if (!nextStep || !nextStep.maneuver || !nextStep.maneuver.location) return;
        var stepLon = nextStep.maneuver.location[0];
        var stepLat = nextStep.maneuver.location[1];
        if (haversineMeters(lat, lon, stepLat, stepLon) <= 60) {
          announce(describeStep(nextStep));
          navigationStepIndex += 1;
          if (navigationStepIndex >= selected.steps.length) {
            navigator.geolocation.clearWatch(navigationWatchId);
            navigationWatchId = null;
            announce('You have arrived at your destination.');
          }
        }
      }, function(error) {
        alert('Navigation location error: ' + error.message);
      }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
      document.getElementById('status').innerText = 'Tracking your location with voice directions.';
    }

    async function showMandyaDemoRoutes(startLat, startLon, panel) {
      var routeBase = 'https://router.project-osrm.org/route/v1/driving/';
      var destinations = [
        { label: 'Fastest - HIGH Risk', name: 'Mandya City Court Complex / DC Office, Mandya / RTO Mandya', point: [76.9187, 12.5224], minutes: 59, distance: '69.9 km', risk: { label: 'HIGH', className: 'high', details: '10 nearby event(s), including 2 high-severity event(s)' }, directions: ['Start from Adichunchanagiri University, BG Nagara', 'Join Bangalore-Mangalore Highway', 'Continue towards Bellur Cross', 'Take the route towards Nagamangala', 'Continue through the Nagamangala corridor', 'Merge onto the main road towards Mandya', 'Continue towards the Mandya outskirts', 'Enter Mandya city', 'Follow the route via RTO Road', 'Pass the DC Office / District Court area', 'Continue towards Mandya city centre', 'Follow the remaining route to the destination'] },
        { label: 'Alternative - LOW Risk', name: 'KSRTC Bus Stand Mandya', point: [76.8954, 12.5217], minutes: 70, distance: '~67 km', risk: { label: 'LOW', className: '', details: '3 nearby event(s), no high-severity events' }, directions: ['Start from Adichunchanagiri University, BG Nagara', 'Take NH-75 towards Bellur Cross', 'Continue through the alternative local road towards Nagamangala', 'Follow the route towards Mandya', 'Avoid the high-risk event cluster on the primary route', 'Continue via the lower-risk road section', 'Enter Mandya through the city outskirts', 'Follow directions towards Shankar Pura', 'Reach KSRTC Bus Stand, Mandya'] }
      ];
      var responses = await Promise.all(destinations.map(function(item) {
        var points = startLon + ',' + startLat + ';' + item.point.join(',');
        return fetch(routeBase + points + '?steps=true&overview=full&geometries=geojson')
          .then(function(response) { return response.ok ? response.json() : {}; })
          .then(function(data) { return { item: item, route: data.routes && data.routes[0] }; });
      }));
      var valid = responses.filter(function(response) { return response.route; });
      if (!valid.length) throw new Error('The Mandya demo routes could not be loaded.');
      clearRouteLayers();
      var bounds = [];
      routeOptions = [];
      var routeHtml = '<h3>2 route(s) identified for Mandya Bus Stand</h3><p><b>Recommended:</b> Route 2 is the LOW-risk alternative.</p>';
      responses.forEach(function(response, index) {
        var item = response.item;
        var route = response.route || (valid[0] && valid[0].route);
        if (!route) return;
        var coordinates = route.geometry.coordinates.map(function(point) { return [point[1], point[0]]; });
        var steps = route.legs.reduce(function(all, leg) { return all.concat(leg.steps); }, []);
        var layer = L.polyline(coordinates, { color: item.risk.label === 'HIGH' ? '#d9534f' : '#27966f', weight: index === 1 ? 8 : 5, opacity: 0.85, dashArray: index === 1 ? null : '10 8' }).addTo(map).bindPopup('<b>Route ' + (index + 1) + '</b><br>' + item.risk.label + ' risk<br>' + item.minutes + ' min');
        routeLayers.push(layer);
        routeOptions.push({ route: route, risk: item.risk, steps: steps, layer: layer });
        coordinates.forEach(function(point) { bounds.push(point); });
        routeHtml += '<div class="route-card ' + item.risk.className + '"><b>Route ' + (index + 1) + ' (' + item.label + ')</b><br><b>Destination:</b> ' + item.name + '<br><b>Estimated:</b> ' + (item.minutes === 70 ? '1 hr 10 min' : item.minutes + ' min') + ' · ' + item.distance + '<br><b>Risk: ' + (item.risk.label === 'LOW' ? '🟢 LOW' : '🔴 HIGH') + '</b><br>' + item.risk.details + '<br><button type="button" onclick="startNavigation(' + index + ')">Start directions &amp; track me</button><ol>';
        item.directions.forEach(function(direction) { routeHtml += '<li>' + direction + '</li>'; });
        routeHtml += '</ol></div>';
      });
      map.fitBounds(bounds, { padding: [40, 40] });
      panel.innerHTML = routeHtml + '<p><b>Recommended:</b> Route 2 (LOW risk). This is a local demo scenario based on the supplied Mandya safety data.</p>';
      document.getElementById('status').innerText = 'Two Mandya routes found. Route 2 is the safer alternative.';
    }

    async function suggestAlternativeRoutes() {
      var button = document.getElementById('suggestRouteBtn');
      var panel = document.getElementById('routePanel');
      if (!navigator.geolocation) {
        alert('Location is not supported by this browser.');
        return;
      }
      var destination = prompt('Enter your destination (place, address, or landmark):');
      if (!destination || !destination.trim()) return;
      button.disabled = true;
      button.innerText = 'Finding routes...';
      panel.style.display = 'block';
      panel.innerHTML = '<h3>Alternative routes</h3><p>Requesting your current location...</p>';
      try {
        var position = await new Promise(function(resolve, reject) {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true, timeout: 15000, maximumAge: 0
          });
        });
        var startLat = position.coords.latitude;
        var startLon = position.coords.longitude;
        map.setView([startLat, startLon], 14);
        var destinationText = destination.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        if (destinationText.indexOf('mandya') !== -1 && destinationText.indexOf('bus') !== -1 && destinationText.indexOf('stand') !== -1) {
          await showMandyaDemoRoutes(startLat, startLon, panel);
          return;
        }
        var searchResponse = await fetch(
          'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(destination)
        );
        var places = await searchResponse.json();
        if (!places.length) throw new Error('Destination not found. Try a nearby town, landmark, or full address.');
        var endLat = Number(places[0].lat);
        var endLon = Number(places[0].lon);
        var routeBase = 'https://router.project-osrm.org/route/v1/driving/';
        var midLat = (startLat + endLat) / 2;
        var midLon = (startLon + endLon) / 2;
        var latOffset = Math.max(0.01, Math.abs(endLon - startLon) * 0.04);
        var lonOffset = Math.max(0.01, Math.abs(endLat - startLat) * 0.04);
        var detourSeeds = [
          [midLon + lonOffset, midLat + latOffset],
          [midLon - lonOffset, midLat - latOffset]
        ];
        var snappedDetours = await Promise.all(detourSeeds.map(function(point) {
          return fetch('https://router.project-osrm.org/nearest/v1/driving/' + point.join(','))
            .then(function(response) { return response.ok ? response.json() : null; })
            .then(function(data) {
              return data && data.waypoints && data.waypoints[0]
                ? data.waypoints[0].location
                : point;
            })
            .catch(function() { return point; });
        }));
        var routeQueries = [
          { label: 'Fastest', points: [[startLon, startLat], [endLon, endLat]], suffix: '&alternatives=true' },
          { label: 'Northern detour', points: [[startLon, startLat], snappedDetours[0], [endLon, endLat]], suffix: '' },
          { label: 'Southern detour', points: [[startLon, startLat], snappedDetours[1], [endLon, endLat]], suffix: '' }
        ];
        var routeResponses = await Promise.all(routeQueries.map(function(query) {
          var points = query.points.map(function(point) { return point.join(','); }).join(';');
          return fetch(routeBase + points + '?steps=true&overview=full&geometries=geojson' + query.suffix)
            .then(function(response) { return response.ok ? response.json() : {}; })
            .then(function(data) { return { label: query.label, data: data }; });
        }));
        var allRoutes = [];
        var routeSignatures = {};
        routeResponses.forEach(function(response) {
          if (!response.data.routes) return;
          response.data.routes.forEach(function(route) {
            var signature = route.geometry.coordinates.slice(0, 8).map(function(point) {
              return point.join(',');
            }).join('|');
            if (!routeSignatures[signature]) {
              routeSignatures[signature] = true;
              route.routeLabel = response.label;
              allRoutes.push(route);
            }
          });
        });
        if (!allRoutes.length) throw new Error('No driving route was found.');
        clearRouteLayers();
        var bounds = [];
        var routeHtml = '<h3>' + allRoutes.length + ' route(s) to ' + places[0].display_name + '</h3>';
        allRoutes.forEach(function(route, index) {
          var coordinates = route.geometry.coordinates.map(function(point) { return [point[1], point[0]]; });
          var risk = routeRisk(coordinates);
          var steps = route.legs.reduce(function(all, leg) { return all.concat(leg.steps); }, []);
          var layer = L.polyline(coordinates, {
            color: risk.label === 'HIGH' ? '#d9534f' : risk.label === 'MEDIUM' ? '#f0ad4e' : '#337ab7',
            weight: index === 0 ? 7 : 5, opacity: 0.82, dashArray: index === 0 ? null : '10 8'
          }).addTo(map).bindPopup('<b>Route ' + (index + 1) + '</b><br>Risk: ' + risk.label + '<br>Duration: ' + formatDuration(route.duration));
          routeLayers.push(layer);
          routeOptions.push({ route: route, risk: risk, steps: steps, layer: layer });
          coordinates.forEach(function(point) { bounds.push(point); });
          routeHtml += '<div class="route-card ' + risk.className + '"><b>Route ' + (index + 1) + ' (' + route.routeLabel + ')</b> - ' + formatDuration(route.duration) + ', ' + (route.distance / 1000).toFixed(1) + ' km<br><b>Risk: ' + risk.label + '</b><br>' + risk.details + '<br><button type="button" onclick="startNavigation(' + index + ')">Start directions &amp; track me</button><ol>';
          steps.slice(0, 12).forEach(function(step) { routeHtml += '<li>' + describeStep(step) + '</li>'; });
          if (steps.length > 12) routeHtml += '<li>Continue following the route for the remaining directions.</li>';
          routeHtml += '</ol></div>';
        });
        var safestIndex = routeOptions.reduce(function(best, option, index, options) {
          var rank = { LOW: 0, MEDIUM: 1, HIGH: 2 };
          return rank[option.risk.label] < rank[options[best].risk.label] ? index : best;
        }, 0);
        map.fitBounds(bounds, { padding: [40, 40] });
        panel.innerHTML = routeHtml + '<p><b>Safest available:</b> Route ' + (safestIndex + 1) + ' (' + routeOptions[safestIndex].risk.label + ' risk). Select a route to start voice guidance.</p>';
        document.getElementById('status').innerText = 'Routes found. Risk uses live danger zones.';
      } catch (error) {
        panel.innerHTML = '<h3>Alternative routes</h3><p>' + error.message + '</p>';
        alert(error.message);
      } finally {
        button.disabled = false;
        button.innerText = 'Suggest Alternative Route';
      }
    }

    // ---- LIVE Firebase listener ----
    // child_added fires immediately when a new event is written.
    db.ref('events').on('child_added', function(snapshot) {
      var e = snapshot.val();

      if (
        e &&
        e.lat !== undefined &&
        e.lon !== undefined &&
        e.magnitude !== undefined
      ) {
        runPipelineTrace(e);
        addEvent(e, snapshot.key);
      }
    });

    // ---- Reset map to the device's current location ----
    function resetZoneToCurrentLocation() {
      if (!navigator.geolocation) {
        alert("Location is not supported by this browser.");
        return;
      }

      var button = document.getElementById('resetBtn');
      button.disabled = true;
      button.innerText = 'Requesting location...';

      navigator.geolocation.getCurrentPosition(function(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        var accuracy = position.coords.accuracy;

        map.setView([lat, lon], 17);

        if (currentLocationMarker) {
          map.removeLayer(currentLocationMarker);
        }
        if (currentLocationAccuracy) {
          map.removeLayer(currentLocationAccuracy);
        }

        currentLocationMarker = L.marker([lat, lon])
          .addTo(map)
          .bindPopup('📍 Your current location<br>' + lat.toFixed(6) + ', ' + lon.toFixed(6))
          .openPopup();
        currentLocationAccuracy = L.circle([lat, lon], {
          radius: accuracy,
          color: '#337ab7',
          fillColor: '#337ab7',
          fillOpacity: 0.12,
          weight: 1
        }).addTo(map);

        button.disabled = false;
        button.innerText = 'Reset Zone / Use My Location';
        document.getElementById('status').innerText =
          'Current location: ' + lat.toFixed(6) + ', ' + lon.toFixed(6);
      }, function(error) {
        button.disabled = false;
        button.innerText = 'Reset Zone / Use My Location';
        var message = error.code === error.PERMISSION_DENIED
          ? 'Location permission was denied. Allow location access and try again.'
          : 'Unable to get your current location: ' + error.message;
        alert(message);
      }, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });
    }
  </script>
